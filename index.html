<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Days</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="frame">

    <header class="masthead">
      <p class="eyebrow">D4 &middot; Sko' Dukes</p>
      <h1>The Days</h1>
      <p class="tagline">Sound off</p>
    </header>

    <!-- Full list of upcoming events, nearest first, each rendered
         at the same size. Populated automatically by script.js -->
    <section class="ledger">
      <div class="ledger-rule"></div>

      <div id="event-list" class="event-list">
        <!-- entries injected here -->
      </div>

      <div class="ledger-rule"></div>
    </section>

    <p id="empty-message" class="empty-message" hidden>
      No entries on the roster. Add one in <code>script.js</code>.
    </p>

    <footer class="masthead-footer">
      <p>Not affiliated with the DoW &middot; Contact Jet.Kennedy@westpoint.edu for any concerns</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
